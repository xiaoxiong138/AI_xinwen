    enabled: false
  codex_research_inbox:
    enabled: true
    path: data/codex_research/latest.json
    candidate_paths:
      "1300": data/codex_research/candidate_1300.json
      "2100": data/codex_research/candidate_2100.json
    required_schema_version: codex-research-v3
    max_age_minutes: 360
    freshness_reserve_minutes: 360
    minimum_items: 55
