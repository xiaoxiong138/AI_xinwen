sources:
  arxiv:
    enabled: true
    categories:
      - cs.RO
      - cs.AI
      - cs.CV
      - cs.LG
      - eess.SY
    max_results: 56
    candidate_pool: 500
    days_back: 1
    fallback_days:
      - 1
      - 3
      - 7
      - 14
    topic_limits:
      Physical AI: 12
      World Model: 12
      Robotics: 12
      Agent / Models: 10
      Multimodal / Video: 8
      Infra / Efficient AI: 8
    topic_queries:
      Physical AI: all:"physical ai" OR all:"embodied ai" OR all:"vision-language-action" OR all:"robot foundation model" OR all:"embodied agent" OR all:"diffusion policy"
      World Model: all:"world model" OR all:"world models" OR all:"video prediction" OR all:"predictive model" OR all:"latent dynamics" OR all:"dynamics model"
      Robotics: cat:cs.RO OR all:robotics OR all:robot OR all:humanoid OR all:manipulation OR all:locomotion
      Agent / Models: all:"AI agent" OR all:"language model agent" OR all:"tool use" OR all:"reasoning model" OR all:"agentic workflow"
      Multimodal / Video: all:"multimodal model" OR all:"video generation" OR all:"video understanding" OR all:"vision language model"
      Infra / Efficient AI: all:"efficient inference" OR all:"model compression" OR all:"quantization" OR all:"distributed training" OR all:"mixture of experts"
  rss:
    enabled: true
    days_back: 2
    degradation:
      enabled: true
      failure_threshold: 2
      lookback_runs: 6
      recovery_interval_hours: 12
    feeds:
      - name: OpenAI Blog
        url: https://openai.com/news/rss.xml
        platform: Blog
        content_type: news
        max_entries: 15
      - name: Google Research
        url: https://research.google/blog/rss/
        platform: Blog
        content_type: news
        max_entries: 15
